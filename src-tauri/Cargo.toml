[package]
name = "nova"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
# Native OS drag-SOURCE (dragging assets out to Explorer/Photoshop/etc). Drag-IN
# is in Tauri core; drag-out is not, and this is the CrabNebula (Tauri core team's
# company) plugin that wraps their drag-rs. SPIKE: validating Windows behaviour
# before building the real id-only command around drag-rs.
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.51.1", features = ["fs"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "migrate"] }
anyhow = "1.0.102"
walkdir = "2.5.0"
uuid = { version = "1.23.0", features = ["v4"] }
rayon = "1.11.0"
chrono = "0.4.44"
image = "0.25.10"
webp = "0.3.1"
thumbhash = "0.1.0"
base64 = "0.22.1"
# Content fingerprinting for import dedup. Chosen over SHA-256 because it runs at
# roughly memory bandwidth — hashing is now on the import hot path, and this makes
# it disappear next to the file copy that follows it.
blake3 = "1.8.5"
thiserror = "2.0.18"
# `TryStreamExt`, so the manifest can be consumed row-by-row instead of collected.
# Already compiled as part of the sqlx tree, so naming it here costs no build time
# — it only makes the dependency honest.
futures-util = { version = "0.3", default-features = false }
# Faster hashing for the id-keyed maps on the import and bulk-action paths.
# std's SipHash is DoS-resistant, which is the right default for a server
# hashing attacker-supplied keys — Nova hashes its OWN uuids, in-process, at six
# figures per import, and pays for a guarantee it cannot use.
rustc-hash = "2"
tracing = "0.1.44"
tracing-subscriber = { version ="0.3.23", features = ["env-filter"] }
# TODO  — uncomment when file-based logs for CI artifacts / crash reports:
# tracing-appender = "0.2"

# ── Lints ─────────────────────────────────────────────────────────────────────
#
# Declared here rather than left to whoever remembers the right clippy
# invocation. CI runs `-D warnings` on top of this, so the two agree instead of
# drifting.
#
# `correctness` is DENY because every lint in that group is "this is a bug", not
# "this is a style" — there is no version of the codebase where shipping one is
# the right call. The rest are warn: they are worth seeing and worth arguing
# with, and a lint that blocks a release over a matter of taste teaches people
# to reach for `#[allow]` reflexively.
#
# Not enabled: `pedantic`. It fires on things this codebase does deliberately
# (long literal SQL, `as` casts in the colour maths), and a hundred suppressions
# would say less than the handful of comments already explaining those choices.
[lints.clippy]
correctness = "deny"
suspicious = "warn"
complexity = "warn"
perf = "warn"

# Tried and rejected: `unused_crate_dependencies`. With the lib+bin split this
# crate needs for mobile, `main.rs` is a passthrough to `nova_lib::run()` — so
# from the BIN's point of view every one of the 20 dependencies is unused, and
# the lint emits 23 warnings that are all wrong. Exactly the reflex-`#[allow]`
# trainer described above.

# ── Build profiles ────────────────────────────────────────────────────────────

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# NOTE: deliberately NOT panic = "abort" — AppError::TaskJoin relies on catching
# a panicked spawned task's JoinError; "abort" would kill the process instead.

# Optimize DEPENDENCIES at full speed even in dev/debug builds. Nova's own crate
# still compiles unoptimized (fast incremental rebuilds), but image decode/resize
# and WebP encode — which dominate thumbnail time — run 10-50x faster. This is the
# single biggest win for dev-mode import/thumbnail performance.
[profile.dev.package."*"]
opt-level = 3
